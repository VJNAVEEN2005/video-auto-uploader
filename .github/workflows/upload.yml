name: 🎬 Auto Upload Video

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC daily
    - cron: '0 14 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      force_episode:
        description: 'Force specific episode ID (leave blank for auto)'
        required: false
        default: ''

jobs:
  upload:
    name: Upload to YouTube + Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r auto-uploader/requirements.txt

      - name: 🔐 Create Google Service Account Key
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > auto-uploader/service_account.json

      - name: 🔐 Create YouTube OAuth Token
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > auto-uploader/youtube_token.json

      - name: 🚀 Run Auto Uploader
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          FORCE_EPISODE: ${{ github.event.inputs.force_episode }}
        run: python auto-uploader/main.py

      - name: 🧹 Remove sensitive files
        if: always()
        run: |
          rm -f auto-uploader/service_account.json
          rm -f auto-uploader/youtube_token.json
